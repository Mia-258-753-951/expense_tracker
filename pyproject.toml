[project]
name = "expense-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.128.1",
    "typer>=0.21.1",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "ruff>=0.14.14",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
[tool.ruff.lint.flake8-bugbear]
# Permite llamadas a typer.Option y typer.Argument en valores por defecto
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []


